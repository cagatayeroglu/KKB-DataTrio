name: Fast PR

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-pr:
    name: Fast PR gate
    runs-on: ubuntu-24.04
    # #158: all 3235 tests and secret scan passed, but 41s installation plus
    # 247s tests exceeded the former five-minute whole-job budget at teardown.
    # This changes CI scheduling only, never application/test timeouts.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install repository dependencies
        run: make install-dev

      - name: Run fast PR checks
        run: make pr
