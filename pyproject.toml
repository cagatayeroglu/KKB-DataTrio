[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kkb-agentic-analytics"
version = "0.1.0"
description = "KKB Hackathon agentic financial analytics"
requires-python = ">=3.12"
dependencies = [
  # Untrusted XLSX boundary and fixture writing (DEC-111).
  "openpyxl>=3.1,<4",
  # Typed boundaries and tool argument schemas (DEC-101, DEC-121).
  "pydantic>=2.9,<3",
  # Lakehouse engine and storage format (DEC-112).
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  # Bulk reading of spreadsheets this project retrieved itself (DEC-114).
  "python-calamine>=0.2,<1",
  # Repairing malformed model JSON when the platform has no structured output
  # (DEC-122). Open-weight models make this the likely path, not a contingency.
  "json-repair>=0.30,<1",
  # Granger tests in the causality tool (DEC-120). Brings scipy with it; both
  # are on the DEC-124 allowlist.
  "statsmodels>=0.14.2,<0.16",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# statsmodels ships neither a py.typed marker nor a stubs package. Scoped to
# that one library so strict typing stays on for everything else.
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
