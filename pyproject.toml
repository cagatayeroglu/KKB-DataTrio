[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kkb-agentic-analytics"
version = "0.1.0"
description = "KKB Hackathon agentic financial analytics"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
